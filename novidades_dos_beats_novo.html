<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110b">
<title>Novidades dos Beats | DJ Vince</title>
<style>
:root{--bg:#070b08;--panel:#111914;--panel2:#17231b;--green:#1ed760;--green2:#16a34a;--text:#f4fff6;--muted:#a7b5aa;--line:#26352b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#174327 0,#0a140d 36%,var(--bg) 72%);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-bottom:112px}
header{padding:22px 16px 18px;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#27ed73,#087b39);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 25px #1ed76033}
.brand small{display:block;color:var(--green);font-weight:700;letter-spacing:2px;font-size:10px}
.brand strong{font-size:17px}
.hero{padding:26px 2px 12px}
.tag{color:var(--green);font-size:11px;font-weight:800;letter-spacing:2px}
h1{font-size:clamp(29px,8vw,42px);line-height:1.05;margin:10px 0}
.hero p{color:var(--muted);line-height:1.5;margin:0;max-width:340px}
main{padding:0 15px}
.search{display:flex;align-items:center;gap:10px;background:#111a14;border:1px solid var(--line);border-radius:15px;padding:0 14px;margin:13px 0 19px}
.search span{font-size:18px;color:var(--muted)}
.search input{width:100%;padding:15px 0;background:transparent;border:0;outline:0;color:white;font-size:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px}
.section-head h2{font-size:18px;margin:0}
.count{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.filter{border:1px solid var(--line);background:#101812;color:#dce9df;border-radius:30px;padding:9px 15px;white-space:nowrap;font-size:12px}
.filter.active{background:var(--green);border-color:var(--green);color:#05210e;font-weight:700}
.status{display:none;margin:14px 0;padding:13px;border:1px solid var(--line);background:#101812;border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5}
.song-list{display:grid;gap:10px;margin-top:13px}
.song{display:flex;align-items:center;gap:12px;padding:11px;background:linear-gradient(120deg,#152019,#101712);border:1px solid #1e2b22;border-radius:15px;min-width:0}
.cover{width:57px;height:57px;flex:0 0 57px;border-radius:11px;background:linear-gradient(135deg,#174d2a,#0a1b10);display:grid;place-items:center;font-size:24px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.song-info{min-width:0;flex:1}
.song-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-info small{display:block;color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-actions{display:flex;align-items:center;gap:7px}
.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:#22352a;color:white;font-size:16px;display:grid;place-items:center;text-decoration:none}
.icon-btn.play{background:var(--green);color:#06210e;font-weight:bold}
.empty{padding:28px 18px;text-align:center;border:1px dashed #34483a;border-radius:16px;color:var(--muted);line-height:1.6;font-size:13px}
footer{padding:25px 15px;text-align:center;color:#718076;font-size:11px}
.player{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#101812f5;border-top:1px solid #2b3b30;padding:11px 14px calc(11px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}
.player-top{display:flex;align-items:center;gap:10px}
.player-cover{width:43px;height:43px;border-radius:9px;background:#1b3825;display:grid;place-items:center;flex:0 0 43px}
.player-meta{min-width:0;flex:1}
.player-meta strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.controls{display:flex;align-items:center;gap:13px}
.controls button{background:none;border:0;color:white;font-size:19px;padding:5px}
.controls .main-play{width:39px;height:39px;border-radius:50%;background:var(--green);color:#05210e;font-size:17px}
.progress-row{display:flex;align-items:center;gap:9px;margin-top:8px;color:#93a397;font-size:10px}
input[type=range]{accent-color:var(--green);width:100%;height:3px}
@media(min-width:700px){main,header,footer{max-width:720px;margin-left:auto;margin-right:auto}.song-list{grid-template-columns:1fr 1fr}.player{padding-left:max(14px,calc((100vw - 720px)/2));padding-right:max(14px,calc((100vw - 720px)/2))}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">♫</div><div><small>DJ VINCE APRESENTA</small><strong>Novidades dos Beats</strong></div></div>
  <div class="hero"><div class="tag">🇲🇿 MÚSICA MOÇAMBICANA</div><h1>O teu som.<br>A tua vibe.</h1><p>Descobre músicas, ouve os teus artistas favoritos e leva os teus sons contigo.</p></div>
</header>

<main>
  <div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Pesquisar artista ou música..."></div>
  <div class="section-head"><h2>Explorar músicas</h2><span class="count" id="songCount">0 músicas</span></div>
  <div class="filters">
    <button class="filter active" data-filter="Todas">Todas</button>
    <button class="filter" data-filter="Música">Músicas</button>
    <button class="filter" data-filter="Beat">Beats</button>
  </div>
  <div class="status" id="statusBox" role="status"></div>
  <div class="song-list" id="songList"></div>
</main>
<footer>© <span id="year"></span> Novidades dos Beats · DJ Vince</footer>

<div class="player">
  <div class="player-top">
    <div class="player-cover">♫</div>
    <div class="player-meta"><strong id="playerTitle">Escolhe uma música</strong><small id="playerArtist">DJ Vince · Novidades dos Beats</small></div>
    <div class="controls">
      <button id="prevBtn" aria-label="Anterior">⏮</button>
      <button class="main-play" id="playBtn" aria-label="Reproduzir">▶</button>
      <button id="nextBtn" aria-label="Seguinte">⏭</button>
    </div>
  </div>
  <div class="progress-row"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
/*
  CONFIGURAÇÃO:
  O endereço abaixo é a API Google Apps Script que já estavas a usar.
  Se quiseres mudar a origem das músicas, altera apenas API_URL.
*/
const API_URL = "https://script.google.com/macros/s/AKfycbyo9rEUOIG35eZpOKzyVovmqEA09nFhn37BIjAR_mafcfGYRreRvPYT1yw-Yyfvi1oL/exec";

const $ = id => document.getElementById(id);
const audio = $("audioPlayer");
let songs = [];
let visibleSongs = [];
let currentIndex = -1;
let activeFilter = "Todas";

function songName(song){return song.nome || song.name || song.title || song.filename || "Música sem título";}
function artistName(song){return song.artista || song.artist || song.author || "DJ Vince";}
function songType(song){return (song.tipo || song.type || (String(songName(song)).toLowerCase().includes("beat") ? "Beat" : "Música"));}
function driveId(song){
  if(song.id) return song.id;
  const url = song.url || song.audioUrl || song.link || "";
  const match = String(url).match(/\/file\/d\/([^/]+)/) || String(url).match(/[?&]id=([^&]+)/);
  return match ? match[1] : "";
}
function audioUrl(song){
  const direct = song.audioUrl || song.audio_url || song.url || song.link || song.downloadUrl || song.download_url;
  if(direct && !String(direct).includes("drive.google.com")) return direct;
  const id = driveId(song);
  return id ? "https://drive.google.com/uc?export=download&id="+encodeURIComponent(id) : (direct || "");
}
function downloadUrl(song){
  return song.downloadUrl || song.download_url || audioUrl(song);
}
function coverUrl(song){return song.cover || song.capa || song.image || song.imageUrl || "";}
function formatTime(seconds){
  if(!Number.isFinite(seconds)) return "0:00";
  const m=Math.floor(seconds/60), s=Math.floor(seconds%60);
  return m+":"+String(s).padStart(2,"0");
}
function showStatus(message, show=true){
  $("statusBox").textContent=message;
  $("statusBox").style.display=show?"block":"none";
}
function renderSongs(){
  const term=$("searchInput").value.trim().toLowerCase();
  visibleSongs=songs.map((song,index)=>({...song,_index:index}))
    .filter(song=>(activeFilter==="Todas" || songType(song).toLowerCase().includes(activeFilter.toLowerCase())))
    .filter(song=>(songName(song)+" "+artistName(song)).toLowerCase().includes(term));
  $("songCount").textContent=songs.length+" música"+(songs.length===1?"":"s");
  const list=$("songList");
  list.innerHTML="";
  if(!visibleSongs.length){
    list.innerHTML='<div class="empty">Ainda não há músicas para mostrar com esta pesquisa.<br>Quando a lista estiver disponível, as músicas aparecerão aqui.</div>';
    return;
  }
  visibleSongs.forEach(song=>{
    const card=document.createElement("article");
    card.className="song";
    const cover=coverUrl(song);
    card.innerHTML='<div class="cover">'+(cover?'<img alt="" src="'+escapeHtml(cover)+'">':'♫')+'</div>'+
      '<div class="song-info"><strong>'+escapeHtml(songName(song))+'</strong><small>'+escapeHtml(artistName(song))+'</small></div>'+
      '<div class="song-actions"><button class="icon-btn play" aria-label="Reproduzir">▶</button><a class="icon-btn" aria-label="Baixar" title="Baixar" href="'+escapeHtml(downloadUrl(song))+'" download>↓</a></div>';
    card.querySelector("button").addEventListener("click",()=>playSong(song._index));
    list.appendChild(card);
  });
}
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function loadSongs(){

  showStatus("A carregar músicas...");

  try {

    const response = await fetch(API_URL + "?t=" + Date.now());

    console.log("Resposta:", response.status);

    if (!response.ok) {
      throw new Error("Erro HTTP: " + response.status);
    }

    const data = await response.json();

    console.log("Dados recebidos:", data);

    if (!Array.isArray(data)) {
      throw new Error("A API não devolveu uma lista.");
    }

    songs = data.filter(song => audioUrl(song));

    renderSongs();

    showStatus(
      songs.length + " músicas carregadas com sucesso!",
      false
    );

  } catch (error) {

    console.error("ERRO:", error);

    showStatus("Erro: " + error.message);

  }

  }
function playSong(index){
  const song=songs[index];
  if(!song) return;
  const src=audioUrl(song);
  if(!src){showStatus("Esta música ainda não tem um link de áudio válido.");return;}
  currentIndex=index;
  audio.src=src;
  $("playerTitle").textContent=songName(song);
  $("playerArtist").textContent=artistName(song);
  $("playBtn").textContent="Ⅱ";
  audio.play().catch(error=>{
    console.error("Erro ao reproduzir:",error);
    $("playBtn").textContent="▶";
    showStatus("O navegador não conseguiu reproduzir este ficheiro. Confirma se o áudio está partilhado publicamente no Google Drive e se o link permite reprodução.");
  });
}
$("playBtn").addEventListener("click",()=>{
  if(currentIndex<0){if(songs.length)playSong(0);return;}
  if(audio.paused){audio.play().then(()=>$("playBtn").textContent="Ⅱ").catch(()=>showStatus("Não foi possível iniciar o áudio."));}
  else{audio.pause();$("playBtn").textContent="▶";}
});
$("prevBtn").addEventListener("click",()=>{if(songs.length)playSong((currentIndex-1+songs.length)%songs.length);});
$("nextBtn").addEventListener("click",()=>{if(songs.length)playSong((currentIndex+1)%songs.length);});
audio.addEventListener("ended",()=>{if(songs.length)playSong((currentIndex+1)%songs.length);});
audio.addEventListener("play",()=>$("playBtn").textContent="Ⅱ");
audio.addEventListener("pause",()=>$("playBtn").textContent="▶");
audio.addEventListener("loadedmetadata",()=>$("duration").textContent=formatTime(audio.duration));
audio.addEventListener("timeupdate",()=>{
  $("currentTime").textContent=formatTime(audio.currentTime);
  $("progress").value=audio.duration?(audio.currentTime/audio.duration)*100:0;
});
$("progress").addEventListener("input",()=>{
  if(audio.duration)audio.currentTime=(Number($("progress").value)/100)*audio.duration;
});
$("searchInput").addEventListener("input",renderSongs);
document.querySelectorAll(".filter").forEach(button=>button.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");activeFilter=button.dataset.filter;renderSongs();
}));
$("year").textContent=new Date().getFullYear();
loadSongs();
</script>
</body>
</html>
