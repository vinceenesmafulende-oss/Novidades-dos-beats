<style>
/* Remove margens padrão que deixam o site com bordas brancas/vazias */
body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* O container principal agora ocupa 100% da largura da tela */
.secao-artistas {
    background-color: #141923;
    padding: 60px 0px; /* Padding vertical, zero nas laterais */
    width: 100%;
    text-align: center;
    border-top: 2px solid #00f29a;
    font-family: sans-serif;
    box-sizing: border-box;
}

.secao-artistas h2 {
    color: #00f29a;
    font-size: 28px;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 20px;
}

.secao-artistas > p {
    color: #a0aec0;
    font-size: 14px;
    margin-bottom: 35px;
    padding: 0 20px;
}

/* Alinha os cards centralizados e gerencia o espaçamento flexível */
.galeria-artistas {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap; /* No celular empilha, no PC coloca lado a lado */
    width: 100%;
    padding: 0 15px; /* Pequeno respiro nas bordas do celular */
    box-sizing: border-box;
}

/* O CARD AGORA É TOTALMENTE RESPONSIVO */
.card-artista {
    background: #1e2530;
    padding: 25px;
    border-radius: 16px;
    
    /* Configuração de Ouro para Responsividade: */
    width: 100%;          /* No celular, tenta ocupar toda a largura disponível */
    max-width: 450px;     /* No PC ou telas grandes, ele trava em um tamanho elegante e não estica infinitamente */
    
    box-sizing: border-box; /* Impede que o padding "estoure" a tela */
    text-align: left;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.card-artista:hover {
    transform: translateY(-5px);
    border-color: #00f29a;
}

.foto-container {
    text-align: center;
}

.foto-container img {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    border: 3px solid #00f29a;
    object-fit: cover;
    margin-bottom: 15px;
    box-shadow: 0 0 15px rgba(0, 242, 154, 0.2);
}

.info-artista h3 {
    color: #ffffff;
    font-size: 22px;
    margin: 5px 0 2px 0;
    text-align: center;
}

.estilo-tag {
    display: block;
    color: #00f29a;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    text-align: center;
}

.biografia {
    color: #cbd5e1;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
    font-style: italic;
    border-left: 2px solid rgba(0, 242, 154, 0.3);
    padding-left: 12px;
}

.container-letras {
    margin-bottom: 25px;
    background: #141923;
    padding: 15px;
    border-radius: 8px;
}

.container-letras h4 {
    color: #ffffff;
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 12px;
    text-transform: uppercase;
    font-weight: 600;
}

.item-musica {
    margin-bottom: 8px;
}

.item-musica:last-child {
    margin-bottom: 0;
}

.accordion-letra {
    background: #1e2530;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.accordion-letra summary {
    padding: 12px;
    color: #00f29a;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    outline: none;
    user-select: none;
}

.accordion-letra summary span {
    color: #718096;
    font-weight: normal;
    font-size: 11px;
    margin-left: 5px;
}

.texto-letra {
    padding: 15px;
    background: #111622;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    max-height: 250px;
    overflow-y: auto;
}

.texto-letra p {
    color: #e2e8f0;
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 15px 0;
    white-space: pre-line;
}

.texto-letra p:last-child {
    margin-bottom: 0;
}

.btn-instagram {
    display: block;
    background: transparent;
    color: #00f29a;
    border: 1px solid #00f29a;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease;
}

.btn-instagram:hover {
    background: #00f29a;
    color: #141923;
    box-shadow: 0 4px 12px rgba(0, 242, 154, 0.3);
}
    </style>
