<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidades dos Beats</title>
    <!-- Ícones externos para o Player -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* --- ESTILIZAÇÃO GERAL --- */
        :root {
            --bg-principal: #0b0c10;
            --bg-card: #1f2833;
            --cor-neon: #02f39b; /* Verde neon estilo Spotify, mais agradável aos olhos */
            --cor-neon-hover: #00b875;
            --texto-claro: #ffffff;
            --texto-mutado: #c5c6c7;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--cor-neon);
            font-size: 2rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--texto-mutado);
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* --- CONTAINER DOS BEATS --- */
        .catalog {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- CARD DO BEAT --- */
        .beat-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .beat-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Capa do Beat fictícia */
        .beat-cover {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2c3e50, #000000);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cor-neon);
            font-size: 1.5rem;
        }

        .beat-info {
            display: flex;
            flex-direction: column;
        }

        .beat-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* Badges de Gênero/Tags */
        .beat-tags {
            display: flex;
            gap: 5px;
        }

        .tag {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--cor-neon);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* --- PLAYER CUSTOMIZADO --- */
        .custom-player {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .play-btn {
            background: none;
            border: none;
            color: var(--texto-claro);
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            transition: color 0.2s;
        }

        .play-btn:hover {
            color: var(--cor-neon);
        }

        .time-display {
            font-size: 0.85rem;
            color: var(--texto-mutado);
            min-width: 35px;
        }

        /* Barra de progresso customizada */
        .progress-bar {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: #4f5d75;
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cor-neon);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* --- BOTÃO DE AÇÃO --- */
        .buy-btn {
            background-color: var(--cor-neon);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .buy-btn:hover {
            background-color: var(--cor-neon-hover);
        }

        .buy-btn:active {
            transform: scale(0.98);
        }

        /* Esconde o player padrão do HTML para não duplicar */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Novidades dos Beats</h1>
    <div class="subtitle">As melhores novidades dos beats aqui!</div>

    <div class="catalog">

        <!-- CARD DO BEAT 1 -->
        <div class="beat-card">
            <div class="beat-header">
                <div class="beat-cover"><i class="fa-solid fa-music"></i></div>
                <div class="beat-info">
                    <p class="beat-title">Beat 1 - Nome do Seu Beat</p>
                    <div class="beat-tags">
                        <span class="tag">Trap</span>
                        <span class="tag">140 BPM</span>
                    </div>
                </div>
            </div>

            <!-- Player de Áudio Oculto -->
            <audio id="audio1" src="SEU_ARQUIVO_DE_AUDIO_1.mp3"></audio>

            <!-- Interface do Player Customizado -->
            <div class="custom-player" data-audio="audio1">
                <button class="play-btn"><i class="fa-solid fa-play"></i></button>
                <span class="time-display current-time">0:00</span>
                <input type="range" class="progress-bar" value="0" min="0" max="100">
                <span class="time-display total-time">0:00</span>
            </div>

            <button class="buy-btn">
                <i class="fa-solid fa-cart-shopping"></i> Comprar Licença
            </button>
        </div>

        <!-- CARD DO BEAT 2 -->
        <div class="beat-card">
            <div class="beat-header">
                <div class="beat-cover"><i class="fa-solid fa-compact-disc"></i></div>
                <div class="beat-info">
                    <p class="beat-title">Beat 2 - Nome do Seu Beat</p>
                    <div class="beat-tags">
                        <span class="tag">Boom Bap</span>
                        <span class="tag">90 BPM</span>
                    </div>
                </div>
            </div>

            <!-- Player de Áudio Oculto -->
            <audio id="audio2" src="SEU_ARQUIVO_DE_AUDIO_2.mp3"></audio>

            <!-- Interface do Player Customizado -->
            <div class="custom-player" data-audio="audio2">
                <button class="play-btn"><i class="fa-solid fa-play"></i></button>
                <span class="time-display current-time">0:00</span>
                <input type="range" class="progress-bar" value="0" min="0" max="100">
                <span class="time-display total-time">0:00</span>
            </div>

            <button class="buy-btn">
                <i class="fa-solid fa-cart-shopping"></i> Comprar Licença
            </button>
        </div>

    </div>

    <!-- --- JAVASCRIPT PARA GERENCIAR OS PLAYERS --- -->
    <script>
        document.querySelectorAll('.custom-player').forEach(player => {
            const audioId = player.getAttribute('data-audio');
            const audio = document.getElementById(audioId);
            const playBtn = player.querySelector('.play-btn');
            const playIcon = playBtn.querySelector('i');
            const progressBar = player.querySelector('.progress-bar');
            const currentTimeDisplay = player.querySelector('.current-time');
            const totalTimeDisplay = player.querySelector('.total-time');

            // Formatar segundos em formato MM:SS
            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Alternar Play / Pause
            playBtn.addEventListener('click', () => {
                // Pausar outros áudios ativos para não tocar tudo junto
                document.querySelectorAll('audio').forEach(otherAudio => {
                    if (otherAudio !== audio) {
                        otherAudio.pause();
                        const otherPlayer = document.querySelector(`[data-audio="${otherAudio.id}"]`);
                        if (otherPlayer) otherPlayer.querySelector('.play-btn i').className = 'fa-solid fa-play';
                    }
                });

                if (audio.paused) {
                    audio.play();
                    playIcon.className = 'fa-solid fa-pause';
                } else {
                    audio.pause();
                    playIcon.className = 'fa-solid fa-play';
                }
            });

            // Atualizar o tempo total assim que o arquivo carregar
            audio.addEventListener('loadedmetadata', () => {
                totalTimeDisplay.textContent = formatTime(audio.duration);
            });
