<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novidades dos Beats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            color: #1DB954;
            font-size: 2em;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
        }

        .musica {
            background: #1a1a1a;
            margin: 20px auto;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .musica h3 {
            margin-top: 0;
        }

        iframe {
            display: block;
            width: 100%;
            height: 315px;
            border: none;
            border-radius: 15px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.7em;
            }

            .musica {
                padding: 10px;
                margin: 15px auto;
            }

            iframe {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <h1>Novidades dos Beats</h1>

    <p>As melhores novidades dos beats aqui!</p>

    <div class="musica">
        <h3>Nome da música aqui</h3>

        <iframe
            src="https://www.youtube.com/embed/VIDEO_ID"
            title="Vídeo da música"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
