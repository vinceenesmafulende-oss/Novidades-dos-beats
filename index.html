<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novidades dos Beats</title>
    <style>
        /* Estilos Gerais (Tema Escuro Mantido) */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00ff66; /* Verde Neon */
            font-size: 28px;
            margin-bottom: 5px;
            margin-top: 40px;
        }
        p {
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .card-beat {
            background-color: #161616;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-sizing: border-box;
        }
        .nome-musica {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            margin-bottom: 15px;
        }
        .botao-interesse {
            display: block;
            background-color: #00ff66;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.3s;
        }
        .botao-interesse:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <h1>Novidades dos Beats</h1>
    <p>As melhores novidades dos beats aqui!</p>

    <!-- CARD DO BEAT ÚNICO -->
    <div class="card-beat">
        <div class="nome-musica"> Silva Bregas Mariana </div>
        <audio controls>
            <source src="beat1.mp3" type="audio/mpeg">
            Seu navegador não suporta este áudio.
        </audio>
        <!-- IMPORTANTE: Substitua o número abaixo pelo seu número real -->
        <a href="https://wa.me" target="_blank" class="botao-interesse">Tenho Interesse</a>
    </div>

</body>
</html>
